<!doctype html>
<html lang="pt-BR" data-capibora-opening>
  <head>
    <meta charset="UTF-8" />
    <!-- Startup styles are inline so the first paint does not wait for JavaScript or CSS downloads. -->
    <style id="capibora-startup-style">
      :root {
        --loading-orange: #ee701d;
        --loading-orange-pulse: #ff913d;
        --loading-ink: #27170d;
      }
      html[data-capibora-opening],
      html[data-capibora-opening] body,
      html[data-capibora-opening] #root {
        margin: 0;
        min-height: 100dvh;
        background: var(--loading-orange) !important;
      }
      .fokus-loading,
      .fokus-loading * {
        box-sizing: border-box;
      }
      .fokus-loading {
        min-height: 100dvh;
        font-size: 14px;
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        background: var(--loading-orange);
        color: var(--loading-ink);
      }
      .fokus-loading::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--loading-orange-pulse);
        animation: capibora-loading-background 1.6s ease-in-out infinite;
      }
      .loading-identity {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loading-identity .capibora-mascot {
        width: clamp(140px, 45vw, 200px);
        height: auto;
        object-fit: contain;
        animation: capibora-loading-mascot 1.6s ease-in-out infinite;
      }
      .loading-recovery {
        position: absolute;
        top: calc(50% + 115px);
        width: min(360px, calc(100% - 48px));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        text-align: center;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .loading-recovery > div {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      .loading-recovery button {
        min-height: 44px;
        background: var(--loading-ink);
        color: #fff4ec;
        border-color: var(--loading-ink);
      }
      .loading-recovery .outline-button {
        background: transparent;
        color: var(--loading-ink);
      }
      .loading-failed {
        gap: 24px;
      }
      .loading-failed .loading-recovery {
        position: static;
        width: min(360px, 100%);
        padding-bottom: 0;
      }
      .loading-failed::before,
      .loading-failed .capibora-mascot {
        animation: none;
      }
      @keyframes capibora-loading-background {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes capibora-loading-mascot {
        0%,
        100% {
          transform: scale(0.95);
        }
        50% {
          transform: scale(1.05);
        }
      }
      .fokus-loading .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .fokus-loading::before,
        .loading-identity .capibora-mascot {
          animation: none;
        }
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ee701d" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="%BASE_URL%brand/web/logo-capibora-sem-fundo.webp" fetchpriority="high" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <script>
      // Apply the saved appearance before the first paint, including offline.
      try {
        const theme =
          localStorage.getItem("fokus-trainer:theme") === "light"
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const background = "#ee701d";
        document.documentElement.style.backgroundColor = background;
        document.querySelector('meta[name="theme-color"]').content = background;
        document.querySelector('meta[name="color-scheme"]').content = theme;
        const manifest = document.querySelector('link[rel="manifest"]');
        manifest.href = new URL(
          theme === "dark"
            ? "manifest.webmanifest"
            : "manifest-light.webmanifest",
          manifest.href,
        ).href;
        document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]',
        ).content = theme === "dark" ? "black-translucent" : "default";
      } catch {}
    </script>
    <meta name="apple-mobile-web-app-title" content="Capibora" />
    <meta
      name="description"
      content="Treinos, amigos e pequenas vitórias. Sua rotina de movimento, do seu jeito."
    />
    <meta name="application-name" content="Capibora" />
    <meta property="og:title" content="Capibora · Bora se mexer" />
    <meta property="og:description" content="Treinos, amigos e pequenas vitórias. Sua rotina de movimento, do seu jeito." />
    <meta property="og:site_name" content="Capibora" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=20261019" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=20261019" />
    <title>Capibora · Bora se mexer</title>
  </head>
  <body>
    <div id="root"><div class="fokus-loading"><div class="loading-identity" aria-hidden="true"><img class="capibora-mascot" src="%BASE_URL%brand/web/logo-capibora-sem-fundo.webp" alt="" aria-hidden="true" width="180" height="179" loading="eager" decoding="async" fetchPriority="high"></div><span class="sr-only" role="status" aria-live="polite">Preparando seu espaço…</span></div></div>
    <script>document.documentElement.dataset.capiboraBootStarted = String(performance.now());</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
