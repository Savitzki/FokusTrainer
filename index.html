<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the saved appearance before the first paint, including offline.
      try {
        const theme =
          localStorage.getItem("fokus-trainer:theme") === "dark"
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const background = theme === "dark" ? "#181411" : "#faf8f5";
        document.documentElement.style.backgroundColor = background;
        document.querySelector('meta[name="theme-color"]').content = background;
        document.querySelector('meta[name="color-scheme"]').content = theme;
        const manifest = document.querySelector('link[rel="manifest"]');
        manifest.href = new URL(
          theme === "dark"
            ? "manifest-dark.webmanifest"
            : "manifest.webmanifest",
          manifest.href,
        ).href;
        document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]',
        ).content = theme === "dark" ? "black-translucent" : "default";
      } catch {}
    </script>
    <meta name="apple-mobile-web-app-title" content="FokusTrainer" />
    <meta
      name="description"
      content="Construa sua constância. Registre treinos, acompanhe seu peso e mantenha sua ofensiva com o FokusTrainer."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>FokusTrainer · Um dia de cada vez</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
