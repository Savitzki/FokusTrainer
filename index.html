<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <script>
      // Apply the saved appearance before the first paint, including offline.
      try {
        const theme =
          localStorage.getItem("fokus-trainer:theme") === "light"
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const background = theme === "dark" ? "#121212" : "#faf8f5";
        document.documentElement.style.backgroundColor = background;
        document.querySelector('meta[name="theme-color"]').content = background;
        document.querySelector('meta[name="color-scheme"]').content = theme;
        const manifest = document.querySelector('link[rel="manifest"]');
        manifest.href = new URL(
          theme === "dark"
            ? "manifest.webmanifest"
            : "manifest-light.webmanifest",
          manifest.href,
        ).href;
        document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]',
        ).content = theme === "dark" ? "black-translucent" : "default";
      } catch {}
    </script>
    <meta name="apple-mobile-web-app-title" content="Capibora" />
    <meta
      name="description"
      content="Treinos, amigos e pequenas vitórias. Sua rotina de movimento, do seu jeito."
    />
    <meta name="application-name" content="Capibora" />
    <meta property="og:title" content="Capibora · Bora se mexer" />
    <meta property="og:description" content="Treinos, amigos e pequenas vitórias. Sua rotina de movimento, do seu jeito." />
    <meta property="og:site_name" content="Capibora" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Capibora · Bora se mexer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
